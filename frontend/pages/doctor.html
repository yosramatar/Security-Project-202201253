<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Doctor – HealthCureAlpha</title>
  <link rel="stylesheet" href="../css/styles.css" />
  <script src="../js/auth.js" defer></script>
  <script src="../js/doctor.js" defer></script>
</head>
<body class="theme-dark">
  <div class="page-shell">
    <header class="top-bar">
      <div class="top-bar-left">
        <span class="logo-dot"></span>
        <div class="brand-text">
          <div class="brand-title">Doctor dashboard</div>
          <div class="brand-subtitle">Appointments &amp; diagnosis</div>
        </div>
      </div>
      <div class="top-bar-right">
        <span class="user-badge" data-current-user></span>
        <button id="themeToggle" class="btn-ghost">Dark mode</button>
        <button id="changePasswordBtn" class="btn-outline">Change password</button>
        <button id="logoutBtn" class="btn-outline">Logout</button>
      </div>
    </header>

    <main class="dashboard">
      <section class="card">
        <h2>Assign nurse</h2>
        <p class="muted">Choose a nurse from the staff directory.</p>
        <form id="assignNurseForm" class="form-inline">
          <select id="assignNurseId" required>
            <option value="">Loading nurses…</option>
          </select>
          <button type="submit" class="btn-primary">Assign</button>
        </form>
        <div id="assignNurseMessage" class="form-message"></div>
      </section>

      <section class="card wide">
        <h2>Your appointments</h2>
        <table id="doctorAppointmentsTable" class="data-table">
          <thead>
            <tr>
              <th>ID</th>
              <th>Date/time</th>
              <th>Patient</th>
              <th>Status</th>
              <th>Use</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </section>

      <section class="card">
        <h2>Write diagnosis</h2>
        <form id="diagnosisForm" class="form-vertical">
          <label>
            Appointment ID
            <select id="diagAppointmentId" required>
              <option value="">Select appointment</option>
            </select>
          </label>
          <label>
            Notes
            <textarea id="diagNotes" rows="4" placeholder="Clinical notes…" required></textarea>
          </label>
          <button type="submit" class="btn-primary full-width">Save diagnosis</button>
        </form>
        <div id="diagnosisMessage" class="form-message"></div>
      </section>
    </main>
  </div>
</body>
</html>
