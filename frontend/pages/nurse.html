<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Nurse – HealthCureAlpha</title>
  <link rel="stylesheet" href="../css/styles.css" />
  <script src="../js/auth.js" defer></script>
  <script src="../js/nurse.js" defer></script>
</head>
<body class="theme-dark">
  <div class="page-shell">
    <header class="top-bar">
      <div class="top-bar-left">
        <span class="logo-dot"></span>
        <div class="brand-text">
          <div class="brand-title">Nurse dashboard</div>
          <div class="brand-subtitle">Medications &amp; support</div>
        </div>
      </div>
      <div class="top-bar-right">
        <span class="user-badge" data-current-user></span>
        <button id="themeToggle" class="btn-ghost">Dark mode</button>
        <button id="changePasswordBtn" class="btn-outline">Change password</button>
        <button id="logoutBtn" class="btn-outline">Logout</button>
      </div>
    </header>

    <main class="dashboard">
      <section class="card wide">
        <h2>Your appointments</h2>
        <table id="nurseAppointmentsTable" class="data-table">
          <thead>
            <tr>
              <th>ID</th>
              <th>Date/time</th>
              <th>Patient</th>
              <th>Doctor</th>
              <th>Use</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </section>

      <section class="card">
        <h2>Write medications</h2>
        <p class="muted">One medication per line, e.g. “Paracetamol 500mg”.</p>
        <form id="medsForm" class="form-vertical">
          <label>
            Appointment ID
            <select id="medsAppointmentId" required>
              <option value="">Select appointment</option>
            </select>
          </label>
          <label>
            Medications
            <textarea id="medsText" rows="5"></textarea>
          </label>
          <button type="submit" class="btn-primary full-width">Save medications</button>
        </form>
        <div id="medsMessage" class="form-message"></div>
      </section>
    </main>
  </div>
</body>
</html>
